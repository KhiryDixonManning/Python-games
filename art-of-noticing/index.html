    <title>The Art of Noticing</title>

  <body>
    <div id="root"></div>
    <noscript>
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:28px;padding:56px 24px;text-align:center;font-family:'Cormorant Garamond',Georgia,serif;color:#f1e6d9;background:#08090d">
        <p style="font-style:italic;font-size:22px;margin:0">Some things are easier to make than say.</p>
        <img src="./art/ryan-night.png" alt="Ryan, in the night garden." style="width:min(78vw,360px)" />
        <div style="max-width:34em;font-size:18px;line-height:1.4">
          <p>I think we make things for the same reason.</p>
          <p>You draw what you feel.<br />I build what I imagine.</p>
          <p>So I made this.</p>
          <p>And somewhere between that night and now,<br />I started imagining this little world<br />made from things I’ve noticed.</p>
          <p>Not because I think I know everything about you,<br />but because I liked what I was beginning to discover.</p>
          <p>And I wanted to make something beautiful<br />out of that feeling.</p>
        </div>
      </div>
    </noscript>
